<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CORS test — Khalique register</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
         max-width: 640px; margin: 40px auto; padding: 0 18px; color: #1C2B26; line-height: 1.5; }
  h1 { font-size: 20px; }
  input { width: 100%; padding: 11px; font-size: 15px; border: 1px solid #D9E2DD; border-radius: 8px; margin: 6px 0 14px; }
  button { background: #1F6F54; color: #fff; border: 0; border-radius: 8px; padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer; }
  pre { background: #F4F7F5; border: 1px solid #E3EAE6; border-radius: 8px; padding: 14px; white-space: pre-wrap; word-break: break-word; margin-top: 18px; }
  .ok { color: #1F6F54; font-weight: 700; }
  .bad { color: #A32B24; font-weight: 700; }
  p.note { color: #6B7B75; font-size: 13px; }
</style>
</head>
<body>
  <h1>CORS round-trip test</h1>
  <p class="note">
    This proves a static page on this origin can call the Apps Script backend and
    read the reply. Open it from the deployed GitHub Pages URL (not a local file),
    paste the web-app <code>/exec</code> URL, and click Ping.
  </p>

  <label for="url">Apps Script web-app URL (…/exec)</label>
  <input id="url" placeholder="https://script.google.com/macros/s/…/exec">

  <button id="go">Ping</button>

  <pre id="out">Ready.</pre>

  <script src="config.js"></script>
  <script>
    var out = document.getElementById('out');
    var urlInput = document.getElementById('url');
    if (window.CONFIG && CONFIG.EXEC_URL && CONFIG.EXEC_URL.indexOf('PASTE') !== 0) {
      urlInput.value = CONFIG.EXEC_URL;
    }

    document.getElementById('go').addEventListener('click', function () {
      var url = urlInput.value.trim();
      if (!url) { out.textContent = 'Enter the /exec URL first.'; return; }
      out.innerHTML = 'Pinging ' + url + ' …';
      var t0 = Date.now();

      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'ping' }),
        redirect: 'follow'
      }).then(function (r) {
        return r.text().then(function (text) {
          var ms = Date.now() - t0;
          var json;
          try { json = JSON.parse(text); }
          catch (e) {
            out.innerHTML = '<span class="bad">Got a reply, but it was not JSON.</span>\n\n'
              + 'This is usually the deployment access setting: it must be\n'
              + '"Who has access: Anyone". First 400 chars:\n\n' + text.slice(0, 400);
            return;
          }
          out.innerHTML = '<span class="ok">✓ CORS works — round trip ' + ms + ' ms</span>\n\n'
            + JSON.stringify(json, null, 2)
            + (json.configured === false
                ? '\n\nBackend reachable, but not configured yet: set OAUTH_CLIENT_ID and ALLOWED_EMAILS in Script Properties.'
                : '');
        });
      }).catch(function (e) {
        out.innerHTML = '<span class="bad">✗ Request blocked or failed.</span>\n\n'
          + String(e) + '\n\n'
          + 'If this says "Failed to fetch", the browser blocked the cross-origin\n'
          + 'call. Re-check that the deployment is "Anyone" and the URL ends in /exec.';
      });
    });
  </script>
</body>
</html>
